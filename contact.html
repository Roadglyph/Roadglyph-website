<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - ROADGLYPH</title>
  <meta name="description" content="Roadglyph: Our work ranges between the simple set-up and day to day management of webpages and social-media profiles, through to full-blown publicity strategies for one-off projects, events, tours and/or longer term development.">
  <meta name="keywords" content="publicist, marketer, handlers, contemporary art, contemporary music, ensemble, artists, producers, health care provider, tactical marketing, strategic marketing, social media, webpage design, publicity, events, tours, development, radio, TV, podcast">
  <meta property="og:site_name" content="ROADGLYPH">
  <meta property="og:title" content="Contact">
  <meta property="og:image" content="images/glyphs-wide.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dosis:wght@600&family=Montserrat:wght@400&family=Roboto:wght@400&family=Lato:ital,wght@0,400;1,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="contact">
  <header class="site-header wrap">
    <a class="site-title" href="index.html">Roadglyph</a>
    <div class="navbar"><span class="rule"></span><ul class="nav"><li><a href="index.html">Home</a></li><li><a href="contact.html" aria-current="page">Contact</a></li></ul><span class="rule"></span></div>
  </header>
  <main>
    <div class="banner-wrap">
      <a class="banner" href="index.html"><img src="images/glyphs-wide.jpg" alt="Roadglyph"></a>
    </div>
    <section class="band">
      <form class="form" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
        <span class="lbl">Name <span class="req">*</span></span>
        <div class="row">
          <div><input id="first" name="first_name" type="text" placeholder="First" aria-label="First name" required autocomplete="given-name"><span class="cap" aria-hidden="true">First</span></div>
          <div><input id="last" name="last_name" type="text" placeholder="Last" aria-label="Last name" required autocomplete="family-name"><span class="cap" aria-hidden="true">Last</span></div>
        </div>
        <p class="note"><span class="req">*</span> Indicates required field</p>

        <label class="lbl" for="email">Email <span class="req">*</span></label>
        <input id="email" name="email" type="email" required autocomplete="email">

        <label class="lbl gap" for="message">Say Hello <span class="req">*</span></label>
        <textarea id="message" name="message" required></textarea>

        <input class="hp" type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true">
        <button type="submit">Send Away!</button>
      </form>
    </section>
  </main>
  <footer class="site-footer wrap">
    <ul class="nav"><li><a href="index.html">Home</a></li><li><a href="contact.html" aria-current="page">Contact</a></li></ul>
  </footer>

</body>
</html>
